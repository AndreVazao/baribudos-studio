name: Studio CI

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
      - fix/**
      - hotfix/**
  pull_request:
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: client/mobile-app/dist

  backend-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall studio_core

      - name: Import FastAPI app
        run: python -c "from studio_core.api.main import app; print(app.title)"

      - name: Test backend and real FFmpeg video pipeline
        env:
          BARIBUDOS_FFMPEG_TEST_OUTPUT_DIR: ${{ runner.temp }}/baribudos-ffmpeg-validation
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Publish FFmpeg validation report and MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baribudos-ffmpeg-validation
          path: ${{ runner.temp }}/baribudos-ffmpeg-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate route authorization inventory
        run: |
          python scripts/audit_studio_routes.py --output "$RUNNER_TEMP/studio-route-inventory.md" --json-output "$RUNNER_TEMP/studio-route-inventory.json"
          cat "$RUNNER_TEMP/studio-route-inventory.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload route authorization inventory
        uses: actions/upload-artifact@v4
        with:
          name: studio-route-authorization-inventory
          path: |
            ${{ runner.temp }}/studio-route-inventory.md
            ${{ runner.temp }}/studio-route-inventory.json
