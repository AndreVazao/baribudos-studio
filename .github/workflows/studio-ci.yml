name: Studio CI

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
      - fix/**
      - hotfix/**
      - security/**
  pull_request:
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: client/mobile-app/dist

  backend-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall studio_core scripts

      - name: Import FastAPI app
        run: python -c "from studio_core.api.main import app; print(app.title)"

      - name: Test route inventory analyzer
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate heuristic route authorization inventory
        run: |
          python scripts/audit_studio_routes.py --output "$RUNNER_TEMP/studio-route-inventory.md" --json-output "$RUNNER_TEMP/studio-route-inventory.json"
          cat "$RUNNER_TEMP/studio-route-inventory.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate registered FastAPI route and dependency manifest
        run: |
          python scripts/export_studio_fastapi_manifest.py \
            --json-output "$RUNNER_TEMP/studio-fastapi-route-manifest.json" \
            --markdown-output "$RUNNER_TEMP/studio-fastapi-route-manifest.md"
          cat "$RUNNER_TEMP/studio-fastapi-route-manifest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload route authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-route-authorization-evidence
          path: |
            ${{ runner.temp }}/studio-route-inventory.md
            ${{ runner.temp }}/studio-route-inventory.json
            ${{ runner.temp }}/studio-fastapi-route-manifest.md
            ${{ runner.temp }}/studio-fastapi-route-manifest.json
