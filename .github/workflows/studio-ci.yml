name: Studio CI

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
      - fix/**
      - hotfix/**
      - security/**
  pull_request:
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: studio-frontend-dist
          path: client/mobile-app/dist

  backend-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx==0.27.2

      - name: Compile backend
        run: python -m compileall studio_core scripts

      - name: Import FastAPI app
        run: python -c "from studio_core.api.main import app; print(app.title)"

      - name: Test backend and FFmpeg video pipeline
        env:
          BARIBUDOS_FFMPEG_TEST_OUTPUT_DIR: ${{ runner.temp }}/baribudos-ffmpeg-validation
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Publish FFmpeg validation report and MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baribudos-ffmpeg-validation
          path: ${{ runner.temp }}/baribudos-ffmpeg-validation/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate heuristic route authorization inventory
        run: |
          python scripts/audit_studio_routes.py --output "$RUNNER_TEMP/studio-route-inventory.md" --json-output "$RUNNER_TEMP/studio-route-inventory.json"
          cat "$RUNNER_TEMP/studio-route-inventory.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate registered FastAPI route and dependency manifest
        env:
          # Exercise the conditional /storage mount using an empty, isolated
          # directory. Never point this audit at a developer or production store.
          BARIBUDOS_STORAGE_ROOT: ${{ runner.temp }}/baribudos-storage-root
        run: |
          mkdir -p "$BARIBUDOS_STORAGE_ROOT"
          python -m scripts.export_studio_fastapi_manifest \
            --json-output "$RUNNER_TEMP/studio-fastapi-route-manifest.json" \
            --markdown-output "$RUNNER_TEMP/studio-fastapi-route-manifest.md"
          python -c "import json, os; p=os.path.join(os.environ['RUNNER_TEMP'], 'studio-fastapi-route-manifest.json'); m=json.load(open(p, encoding='utf-8')); mounts=[r for r in m['non_api_http_surface']['routes'] if r['path']=='/storage']; assert len(mounts)==1 and mounts[0]['static_files']['directory_exists'] and mounts[0]['static_files']['authorization_verified'] is False, 'Expected isolated /storage StaticFiles mount to be inventoried'"
          cat "$RUNNER_TEMP/studio-fastapi-route-manifest.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload route authorization evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-route-authorization-evidence
          path: |
            ${{ runner.temp }}/studio-route-inventory.md
            ${{ runner.temp }}/studio-route-inventory.json
            ${{ runner.temp }}/studio-fastapi-route-manifest.md
            ${{ runner.temp }}/studio-fastapi-route-manifest.json
